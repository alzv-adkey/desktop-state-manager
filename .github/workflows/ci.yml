name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        dnf update -y
        dnf install -y python3 python3-gobject wmctrl jq git rpm-build desktop-file-utils
        # Note: GUI tests would need a virtual display

    - name: Make scripts executable
      run: |
        chmod +x *.sh *.py desktop-state-manager desktop-state-manager-cli

    - name: Run component tests
      run: |
        python3 test-desktop-manager.py || true  # Allow partial failure due to GUI deps

    - name: Validate desktop files
      run: |
        desktop-file-validate desktop-state-manager.desktop
        desktop-file-validate desktop-state-manager-fixed.desktop

    - name: Check script syntax
      run: |
        bash -n tilingshell-desktop-restore.sh
        bash -n desktop-cli.sh
        bash -n install-desktop-state-manager.sh
        bash -n launch-desktop-manager.sh
        bash -n restore-desktop-state.sh

    - name: Python syntax check
      run: |
        python3 -m py_compile desktop-state-manager.py
        python3 -m py_compile desktop-state-manager-simple.py
        python3 -m py_compile test-desktop-manager.py

  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install RPM build dependencies
      run: |
        dnf update -y
        dnf install -y rpm-build rpmdevtools desktop-file-utils

    - name: Setup RPM build environment
      run: |
        rpmdev-setuptree

    - name: Extract version from spec file
      id: version
      run: |
        VERSION=$(grep "^Version:" desktop-state-manager.spec | awk '{print $2}')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create source tarball
      run: |
        mkdir -p desktop-state-manager-${{ steps.version.outputs.version }}
        cp -r *.py *.sh *.desktop *.spec *.md desktop-state-manager desktop-state-manager-cli *.png *.svg desktop-state-manager-${{ steps.version.outputs.version }}/
        tar czf ~/rpmbuild/SOURCES/desktop-state-manager-${{ steps.version.outputs.version }}.tar.gz desktop-state-manager-${{ steps.version.outputs.version }}

    - name: Build RPM
      run: |
        rpmbuild -ba desktop-state-manager.spec

    - name: Upload RPM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rpm-packages
        path: |
          ~/rpmbuild/RPMS/noarch/*.rpm
          ~/rpmbuild/SRPMS/*.src.rpm

  release:
    runs-on: ubuntu-latest
    needs: [test, build-rpm]
    if: github.event_name == 'release'
    
    steps:
    - name: Download RPM artifacts
      uses: actions/download-artifact@v4
      with:
        name: rpm-packages
        path: ./packages

    - name: Attach RPMs to release
      uses: softprops/action-gh-release@v1
      with:
        files: ./packages/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install analysis tools
      run: |
        pip install flake8 pylint shellcheck-py

    - name: Python linting
      run: |
        flake8 *.py --max-line-length=100 --ignore=E501,W503 || true
        pylint *.py --disable=all --enable=E || true

    - name: Shell script analysis
      run: |
        shellcheck *.sh || true
