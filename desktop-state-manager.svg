<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for main background -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for windows -->
    <linearGradient id="windowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for restore arrow -->
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#50C878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E8B57;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main background circle -->
  <circle cx="64" cy="64" r="58" fill="url(#mainGradient)" filter="url(#dropshadow)" stroke="#2C5AA0" stroke-width="2"/>
  
  <!-- Desktop/Monitor frame -->
  <rect x="20" y="25" width="88" height="60" rx="6" ry="6" fill="#2C3E50" stroke="#34495E" stroke-width="2"/>
  <rect x="24" y="29" width="80" height="52" rx="3" ry="3" fill="#ECF0F1"/>
  
  <!-- Virtual desktop grid (4 small rectangles representing workspaces) -->
  <rect x="28" y="33" width="16" height="10" rx="1" fill="#3498DB" stroke="#2980B9" stroke-width="0.5"/>
  <rect x="46" y="33" width="16" height="10" rx="1" fill="#E74C3C" stroke="#C0392B" stroke-width="0.5"/>
  <rect x="64" y="33" width="16" height="10" rx="1" fill="#F39C12" stroke="#E67E22" stroke-width="0.5"/>
  <rect x="82" y="33" width="16" height="10" rx="1" fill="#27AE60" stroke="#229954" stroke-width="0.5"/>
  
  <!-- Application windows in the main area -->
  <!-- Window 1 -->
  <rect x="30" y="48" width="20" height="14" rx="2" fill="url(#windowGradient)" stroke="#BDC3C7" stroke-width="1"/>
  <rect x="30" y="48" width="20" height="3" rx="2" fill="#3498DB"/>
  <circle cx="33" cy="50" r="0.8" fill="#E74C3C"/>
  <circle cx="35.5" cy="50" r="0.8" fill="#F39C12"/>
  <circle cx="38" cy="50" r="0.8" fill="#27AE60"/>
  
  <!-- Window 2 -->
  <rect x="54" y="52" width="18" height="12" rx="2" fill="url(#windowGradient)" stroke="#BDC3C7" stroke-width="1"/>
  <rect x="54" y="52" width="18" height="3" rx="2" fill="#E74C3C"/>
  <circle cx="57" cy="54" r="0.8" fill="#E74C3C"/>
  <circle cx="59.5" cy="54" r="0.8" fill="#F39C12"/>
  <circle cx="62" cy="54" r="0.8" fill="#27AE60"/>
  
  <!-- Window 3 -->
  <rect x="76" y="46" width="22" height="16" rx="2" fill="url(#windowGradient)" stroke="#BDC3C7" stroke-width="1"/>
  <rect x="76" y="46" width="22" height="3" rx="2" fill="#27AE60"/>
  <circle cx="79" cy="48" r="0.8" fill="#E74C3C"/>
  <circle cx="81.5" cy="48" r="0.8" fill="#F39C12"/>
  <circle cx="84" cy="48" r="0.8" fill="#27AE60"/>
  
  <!-- Restore/Save arrows indicating state management -->
  <g transform="translate(64, 95)">
    <!-- Circular arrow for restore -->
    <path d="M -12 0 A 12 12 0 1 1 12 0" fill="none" stroke="url(#arrowGradient)" stroke-width="3" stroke-linecap="round"/>
    <!-- Arrow head -->
    <path d="M 8 -4 L 12 0 L 8 4" fill="none" stroke="url(#arrowGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Save icon (small disk) -->
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#34495E" stroke="#2C3E50" stroke-width="1"/>
    <rect x="-4" y="-4" width="8" height="3" fill="#ECF0F1"/>
    <rect x="-3" y="-1" width="6" height="6" fill="#95A5A6"/>
    <rect x="-1" y="1" width="2" height="2" fill="#BDC3C7"/>
  </g>
  
  <!-- Small gear icon for settings -->
  <g transform="translate(95, 35)">
    <circle cx="0" cy="0" r="6" fill="#F39C12" stroke="#E67E22" stroke-width="1"/>
    <circle cx="0" cy="0" r="3" fill="#FFF"/>
    <!-- Gear teeth -->
    <rect x="-1" y="-8" width="2" height="3" fill="#F39C12"/>
    <rect x="-1" y="5" width="2" height="3" fill="#F39C12"/>
    <rect x="5" y="-1" width="3" height="2" fill="#F39C12"/>
    <rect x="-8" y="-1" width="3" height="2" fill="#F39C12"/>
  </g>
  
  <!-- Auto-restore indicator (small clock/timer) -->
  <g transform="translate(35, 95)">
    <circle cx="0" cy="0" r="5" fill="#9B59B6" stroke="#8E44AD" stroke-width="1"/>
    <circle cx="0" cy="0" r="3" fill="#FFF"/>
    <!-- Clock hands -->
    <line x1="0" y1="0" x2="0" y2="-2" stroke="#8E44AD" stroke-width="1"/>
    <line x1="0" y1="0" x2="1.5" y2="1" stroke="#8E44AD" stroke-width="1"/>
  </g>
</svg>
